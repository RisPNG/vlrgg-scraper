services:
  - type: web
    name: vlrgg-scraper
    runtime: python
    branch: dbless
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: '3.14.7'
      - key: UV_VERSION
        value: '0.12.5'
