name: CI

on:
  push:
    branches: [dbless]
  pull_request:
    branches: [dbless]
  workflow_dispatch:
    inputs:
      base-ref:
        description: Previous Redis deployment commit, required for schema comparison
        type: string
        default: ''
      compare-cached-schemas:
        description: Compare Redis cached schemas with the previous deployment
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact integration commit to validate
        type: string
        required: true
      base-ref:
        description: Base commit for an optional Redis schema comparison
        type: string
        default: ''
      compare-cached-schemas:
        type: boolean
        default: false

permissions:
  contents: read

env:
  TIMEZONE: Asia/Kolkata
  INTERNAL_API_KEY: ci-test-key

jobs:
  stateless:
    name: Stateless API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_DATABASE: 'false'
      ENABLE_CACHE: 'false'
      ENABLE_ID_MAPPING: 'false'
      ENABLE_LIVE_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - name: Install production dependencies
        run: uv sync --frozen --no-dev
      - name: Verify the base installation excludes optional dependencies
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import distributions

          optional = {"sqlalchemy", "alembic", "asyncpg", "firebase-admin", "openai"}
          installed = {dist.metadata["Name"].lower().replace("_", "-") for dist in distributions()}
          assert not optional & installed, f"Optional dependencies installed in the base environment: {optional & installed}"
          from app.main import app

          assert app is not None
          PY
      - name: Install test dependencies
        run: uv sync --frozen
      - name: Run offline tests without optional dependencies
        run: uv run --no-sync pytest -m "not live_golden and not live_health"

  optional-features:
    name: Optional features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      ENABLE_DATABASE: 'true'
      ENABLE_CACHE: 'false'
      ENABLE_ID_MAPPING: 'false'
      ENABLE_LIVE_PUSH: 'false'
      API_KEYS: '{}'
      REDIS_HOST: localhost
      REDIS_PASSWORD: ''
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - name: Install all optional features and test dependencies
        run: uv sync --frozen --all-extras
      - name: Run offline tests with optional features
        run: uv run --no-sync pytest -m "not live_golden and not live_health"

  container:
    name: Production container
    uses: ./.github/workflows/build-docker-image.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
    permissions:
      contents: read

  cached-schemas:
    name: Optional Redis schema comparison
    if: ${{ inputs.compare-cached-schemas }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - run: uv sync --frozen --all-extras
      - name: Compare cached schemas before a Redis-backed deployment
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?Set base-ref to the previous Redis deployment commit}"
          base_dir=$(mktemp -d)
          trap 'rm -rf "$base_dir"' EXIT
          git archive "$BASE_REF" | tar -x -C "$base_dir"
          cp scripts/cached_schema_signature.py "$base_dir/scripts/"
          current=$(.venv/bin/python -m scripts.cached_schema_signature)
          base=$(cd "$base_dir" && "$GITHUB_WORKSPACE/.venv/bin/python" -m scripts.cached_schema_signature)
          if [ "$current" != "$base" ]; then
            echo '::error::Cached model schemas changed. Purge the Redis application cache before deploying this version.'
            exit 1
          fi
