name: Live Parser Health

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  parser-health:
    if: ${{ github.repository == 'RisPNG/vlrgg-scraper' && github.ref == 'refs/heads/dbless' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      REDIS_HOST: localhost
      REDIS_PASSWORD: ""
      TIMEZONE: UTC
      ENABLE_CACHE: "false"
      ENABLE_ID_MAPPING: "false"
      ENABLE_DATABASE: "false"
      ENABLE_LIVE_PUSH: "false"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14.7"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: '0.12.5'

    - name: Install dependencies
      run: uv sync --frozen

    - name: Generate internal API key
      run: echo "INTERNAL_API_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV

    # Structural checks on windowed endpoints + exact snapshots on frozen ones.
    # Upstream 5xx/429 becomes a skip (see tests/live/conftest.py), and VLR
    # sometimes answers 200 with degraded content, so failed checks are retried
    # (pytest-rerunfailures) before the run goes red -- a red run means the
    # parser is broken, not that VLR had a bad night.
    - name: Run live parser checks
      run: >
        uv run --no-sync pytest -m "live_health or live_golden" tests/live tests/golden
        -v --tb=short --reruns 2 --reruns-delay 5 --junitxml=health.xml

    # A job where everything skipped is the failure mode this suite was built to
    # end: green while testing nothing. Skips must not be able to mask the run.
    - name: Fail if every check was skipped
      if: always()
      run: uv run --no-sync python -m tests.live.check_executed health.xml
